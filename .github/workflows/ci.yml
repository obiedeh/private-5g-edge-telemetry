name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run lint (ruff)
        run: ruff check .
      - name: Type check
        run: mypy private5g_pipeline
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate manufacturing scenario
        run: python -m private5g_pipeline.scenarios --vertical manufacturing
      - name: Regenerate pharma scenario
        run: python -m private5g_pipeline.scenarios --vertical pharma
      - name: Regenerate business cases
        run: python -m private5g_pipeline.business_cases --case all
      - name: Regenerate evidence portal + dashboard
        run: python -m private5g_pipeline.portal --target both
      - name: Regenerate benchmarks
        run: python -m private5g_pipeline.benchmarks
      - name: Verify committed evidence artifacts exist
        run: |
          test -f TECH_BRIEF.md
          test -f reports/index.html
          test -f reports/dashboard.html
          test -f reports/benchmarks.md
          test -f reports/benchmarks.json
          test -f reports/scenarios/manufacturing_agv/dashboard_summary.md
          test -f reports/scenarios/manufacturing_agv/scenario_metrics.json
          test -f reports/scenarios/manufacturing_agv/telemetry.csv
          test -f reports/scenarios/manufacturing_agv/hourly_kpis.csv
          test -f reports/scenarios/manufacturing_agv/fleet_summary.csv
          test -f reports/scenarios/manufacturing_agv/figures/01_latency_vs_fleet.png
          test -f reports/scenarios/manufacturing_agv/figures/02_edge_load_by_zone.png
          test -f reports/scenarios/manufacturing_agv/figures/03_budget_violation_timeline.png
          test -f reports/scenarios/pharma_bioreactor/dashboard_summary.md
          test -f reports/scenarios/pharma_bioreactor/scenario_metrics.json
          test -f reports/scenarios/pharma_bioreactor/telemetry.csv
          test -f reports/scenarios/pharma_bioreactor/hourly_kpis.csv
          test -f reports/scenarios/pharma_bioreactor/threshold_sweep.csv
          test -f reports/scenarios/pharma_bioreactor/figures/01_signal_timeline.png
          test -f reports/scenarios/pharma_bioreactor/figures/02_detector_zscore.png
          test -f reports/scenarios/pharma_bioreactor/figures/03_threshold_sweep.png
          test -f reports/business_cases/manufacturing_agv_capacity.md
          test -f reports/business_cases/manufacturing_agv_sensitivity.json
          test -f reports/business_cases/pharma_bioreactor_anomaly.md
          test -f reports/business_cases/pharma_bioreactor_sensitivity.json
